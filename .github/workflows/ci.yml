name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Prisma needs a connection string to generate the client (npm ci runs
      # prisma generate) and to build; nothing connects to this one.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/spendsync
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
